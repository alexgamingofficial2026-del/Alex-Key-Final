<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALEX SYSTEM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0e14; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
      padding: 16px;
    }

    .gateway-card {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 28px 20px 20px 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .icon-container {
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
    }

    .icon-svg {
      width: 56px;
      height: 56px;
      color: #3fb950;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p.description {
      color: #8b949e;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 24px;
      padding: 0 10px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      transition: all 0.2s ease;
      background-color: transparent;
      color: #ffffff;
      border: 1px solid #3fb950;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .btn:hover {
      background-color: rgba(63, 185, 80, 0.1);
      transform: scale(0.98);
    }

    /* Estilos para la caja de la Key */
    .key-box {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      color: #ffffff;
      text-align: left;
      word-break: break-all;
      margin-bottom: 12px;
      user-select: all;
    }

    /* Botón de Copiar (blanco) */
    .btn-copy {
      width: 100%;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      background-color: #ffffff;
      color: #000000;
      border: none;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-bottom: 30px;
    }

    .btn-copy:hover {
      background-color: #e6e6e6;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: #8b949e;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: #c9d1d9;
    }

    /* Clase para ocultar elementos */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="gateway-card">
    
    <!-- VISTA 1: Botón inicial -->
    <div id="initial-view">
      <div class="icon-container">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"></polygon>
          <line x1="12" y1="11" x2="12" y2="16"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </div>
      <h1>ALEX SYSTEM</h1>
      <!-- Texto corregido aquí -->
      <p class="description">Get your ALEX X EXECUTOR key for free and execute scripts.</p>
      <div class="button-group">
        <button class="btn" onclick="generateKey()">Generate Key</button>
      </div>
    </div>

    <!-- VISTA 2: Resultado (Oculto al inicio) -->
    <div id="result-view" class="hidden">
      <div class="icon-container">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
      </div>
      
      <h1>Successfully whitelisted!</h1>
      <p class="description">
        Please return to the service for access, you have 2 hours left.
      </p>

      <div id="key-display" class="key-box">
        KEY_ALEX_C...
      </div>

      <button class="btn-copy" onclick="copyKey()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copy-text">Copy</span>
      </button>
    </div>

    <div class="footer-links">
      <a href="#">Report</a>
      <a href="#">Terms of Service</a>
      <a href="#">Privacy Policy</a>
    </div>

  </div>

  <script>
    let currentKey = "";

    function generateKey() {
      const caracteres = 'abcdef0123456789';
      let cadenaAleatoria = '';
      for (let i = 0; i < 32; i++) {
        cadenaAleatoria += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
      }

      currentKey = "KEY_ALEX_C" + cadenaAleatoria;

      document.getElementById("key-display").innerText = currentKey;
      document.getElementById("initial-view").classList.add("hidden");
      document.getElementById("result-view").classList.remove("hidden");
    }

    function copyKey() {
      if (!currentKey) return;

      navigator.clipboard.writeText(currentKey).then(() => {
        const copyText = document.getElementById("copy-text");
        copyText.innerText = "Copied!";
        
        setTimeout(() => {
          copyText.innerText = "Copy";
        }, 2000);
      }).catch(err => {
        console.error("Error al copiar: ", err);
        alert("Hubo un error al copiar. Por favor, selecciona el texto manualmente.");
      });
    }
  </script>

</body>
</html>
